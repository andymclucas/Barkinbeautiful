  <!--
    Traced from groomigo_logo_hd.png (2064x1219), the real artwork.

    This REPLACES a hand-reconstructed version that was not the same dog:
    it had no pendant-ear loop, a different muzzle and no brow, and its
    stroke sat about a quarter too heavy. It was the browser favicon, so
    the tab has been showing the wrong mark.

    A filled outline, not a stroked centreline — the outline is what the
    original artwork actually is, so this scales and prints exactly like
    the PNG instead of approximating it. There is still no vector master
    from the designer; if one turns up it should replace this.
  -->
